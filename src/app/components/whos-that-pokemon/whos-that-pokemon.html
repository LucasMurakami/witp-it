<div class="card-container">
  <div class="card-glow"></div>
  <div class="card-content">
    <!-- Top Content -->
    <h2 class="title">Who's that Pokémon?</h2>

    <!-- Middle Content -->
    <ng-content select="[middle-content]"></ng-content>

    <!-- Bottom Content -->
    <!-- Pokemon Logo as Default -->
    <ng-content select="[bottom-content]">
      <img class="pokemon-logo" src="res/international-pokemon-logo.svg" alt="Pokémon Logo">
    </ng-content>
    
  </div>
</div>
